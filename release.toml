adapters = ["npm"]
skip_publish = ["@opentf/create-afw"]
tag_format = "{name}@{version}"
provider = "github"
default_branch = "main"
changelog_strategy = "curated"
changelog_scope = "package"
github_release_notes = "auto-generate"

[hooks]

[publish.ignore_paths]
"@opentf/afw-docs" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/esdev-plugin-afw" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/afw-cli" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/afw-i18n" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/afw" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/afw-test" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/afw-form" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]

[[package]]
name = "@opentf/esdev-plugin-afw"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/esdev-plugin-afw/package.json"

[[package]]
name = "@opentf/afw"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/afw/package.json"

[[package]]
name = "@opentf/afw-cli"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/afw-cli/package.json"

[[package]]
name = "@opentf/afw-compiler"
adapter = "npm"
mode = "publish"
matrix = true
command = "cargo build --release -p afw_cli --bin afwc --target {triple}"
artifacts = "target/{triple}/release/{bin}{ext}"
bin_name = "afwc"
compress = "brotli"
manifest = "packages/afw-compiler/package.json"

[[package.targets]]
name = "linux"
arch = "x86_64"
triple = "x86_64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-x64"

[[package.targets]]
name = "macos"
arch = "aarch64"
triple = "aarch64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-arm64"

[[package.targets]]
name = "macos"
arch = "x86_64"
triple = "x86_64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-x64"

[[package.targets]]
name = "windows"
arch = "x86_64"
triple = "x86_64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-x64"
ext = ".exe"

# The compiler publishes from a matrix: its builds run on other runners, so the
# LICENSE copy (the other packages' `npm run build`) is a setup step here, which
# runs in every job of this package, including the publish job.
[[package.setup]]
run = ["cp LICENSE packages/afw-compiler/LICENSE"]

[[package]]
name = "@opentf/afw-docs"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/afw-docs/package.json"

[[package]]
name = "@opentf/afw-form"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/afw-form/package.json"

[[package]]
name = "@opentf/afw-i18n"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/afw-i18n/package.json"

[[package]]
name = "@opentf/afw-test"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/afw-test/package.json"
