# tasks.toml — the workspace root anchor and config for `tsr`.
# Docs: https://tsr.opentechf.org/docs
#
# One discoverable entry point for the repo's tasks — `tsr --list` — instead of knowing
# which of the root package.json, a package's own scripts, or a bare cargo/wrangler
# command holds the one you want. CI runs `tsr test` and `tsr test-e2e`, so what is
# defined here is what CI enforces.
#
# Multi-step work is expressed with `deps`, not shell `&&`: each step stays a task you
# can run on its own — `tsr test-e2e-docs-hydration` when debugging that one suite —
# and tsr owns the ordering and the per-step reporting.
#
# `build-compiler` is declared as a dep of every leaf that needs the binary rather than
# listed as a sibling beside them. tsr de-duplicates shared deps (a diamond runs its base
# once) and will not start a task until its own deps finish, so this is what makes
# `parallel = true` safe: as a sibling it would race the tasks that need its output.

[workspace]
members = ["packages/*", "playground", "benchmarks/*", "website"]

# --- develop ------------------------------------------------------------------

# The playground is the framework's own scratch app, on its own config
# (esdev.playground.json — root-level so plugin modules resolve inside the repo
# jail; pnpm symlinks a per-app config's node_modules outside its own root).
# One afw target, CSR like the old CLI dev.
[tasks.dev]
run = "esdev start --config=esdev.playground.json --port=3005"

# The website is its own pnpm project on the published packages (website/pnpm-lock.yaml),
# so it builds exactly what users install. Site tasks run from website/, where its
# esdev.json and node_modules live. After a release, bump the versions in
# website/package.json and run `tsr site-install`.
[tasks.site-install]
run = "pnpm install --frozen-lockfile"
dir = "website"

[tasks.site]
run = "esdev start --port=3005"
dir = "website"

[tasks.site-preview]
run = "esdev preview"
dir = "website"

# --- check --------------------------------------------------------------------

[tasks.typecheck]
run = "esdev typecheck"

# The compiler binary, which several suites need on disk: `hydrate.e2e` shells
# to it directly, and the project's afwc plugin (`esdev.test.json`) compiles `.jsx`
# on load through it. esdev.test.json selects CSR for test imports.
# The e2e drive the real toolchain.
[tasks.build-compiler]
run = "cargo build"

[tasks.test-rust]
deps = ["build-compiler"]
run = "cargo test"

# Runtime-native tests: the SSG lib, scaffolder, and framework's pure core/server paths.
[tasks.test-esdev]
deps = ["build-compiler"]
run = "esdev test --config=esdev.test.json packages/afw-cli/tests packages/afw-compiler/tests packages/afw/core/reactive.test.js packages/afw/core/signals.test.js packages/afw/esdev-tests/clsx.test.js packages/afw/esdev-tests/jsx-types.test.js packages/afw/server/api.test.js packages/afw/server/cookies.test.js packages/afw/server/head.test.js packages/afw/server/index.test.js packages/afw/server/loader.test.js packages/afw/server/middleware.test.js packages/afw/server/render.test.js packages/afw/server/ssg-runtime.test.js packages/afw/server/adapters/node.test.js"

# DOM suites: these ran under happy-dom's ambient `document` before; under esdev
# the `--dom` realm provides it instead (esdev's URL is http://localhost/, so the
# old `window.happyDOM?.setURL` guards are harmless no-ops). `resource.test.js`
# needs it too — without a `document` the resource thinks it is server-side.
[tasks.test-esdev-dom]
deps = ["build-compiler"]
run = "esdev test --config=esdev.test.json --dom packages/afw/core/errors.test.js packages/afw/runtime/lifecycle.test.js packages/afw/runtime/resource.test.js packages/afw/runtime/clsx.test.js packages/afw/runtime/dom.test.js packages/afw/runtime/router.test.js packages/afw/runtime/router-data.test.js packages/afw/runtime/router-hydrate.test.js packages/afw/runtime/router-hot.test.js packages/afw/runtime/hydratable.test.js packages/afw/runtime/router-nav.test.js packages/afw/runtime/hydrate.e2e.test.js"

# @opentf/esdev-plugin-afw: resolver tests plus real compiler/context integration.
[tasks.test-esdev-plugin]
deps = ["build-compiler"]
run = "esdev test --config=esdev.test.json packages/esdev-plugin-afw/tests"

[tasks.test-afw-docs]
deps = ["build-compiler"]
run = "esdev test --config=esdev.test.json packages/afw-docs/tests/types.test.js packages/afw-docs/tests/docs-nav.test.js packages/afw-docs/tests/blog-posts.test.js packages/afw-docs/tests/frontmatter.test.js packages/afw-docs/tests/feed.test.js packages/afw-docs/tests/post-dates.test.js packages/afw-docs/tests/format.test.js packages/afw-docs/tests/last-updated.test.js packages/afw-docs/tests/llms.test.js packages/afw-docs/tests/search.test.js packages/afw-docs/tests/search-integration.test.js packages/afw-docs/tests/tokenizer.test.js packages/afw-docs/tests/theme-namespace.test.js"

# esdev pre-bundles npm dependencies into one shared cache (node_modules/.esdev/deps).
# Suites that import Testing Library would each populate it on a cold cache, and run
# in parallel they overwrite each other's files mid-load ("cannot resolve module
# …/aria-query-*.mjs"). This one file imports @testing-library/dom and user-event, so
# running it first fills the cache once for test-afw-test, -afw-docs-dom and -afw-form.
[tasks.warm-test-deps]
deps = ["build-compiler"]
run = "esdev test --config=esdev.test.json --dom --setup=@opentf/afw-test/setup packages/afw-test/tests/browser/user-event.test.js"

# esdev applies the test config's AFW plugin to unbundled JSX imports.
# Tests use CSR independently of the website's hydrate build configuration.
[tasks.test-afw-docs-dom]
deps = ["build-compiler", "warm-test-deps"]
run = "esdev test --config=esdev.test.json --dom --setup=@opentf/afw-test/setup packages/afw-docs/tests/MobileDrawer.test.js packages/afw-docs/tests/SidebarCollapseAll.test.js packages/afw-docs/tests/Tabs.test.js"

[tasks.test-afw-form]
deps = ["build-compiler", "warm-test-deps"]
run = "esdev test --config=esdev.test.json --dom packages/afw-form/tests"

[tasks.test-afw-i18n]
deps = ["build-compiler"]
run = "esdev test --config=esdev.test.json --dom packages/afw-i18n/i18n.test.js"

# Public testing helpers in the native DOM realm; setup registers automatic cleanup.
# The userEvent suite runs here and again in a real browser (test-e2e-afw-test).
[tasks.test-afw-test]
deps = ["build-compiler", "warm-test-deps"]
run = "esdev test --config=esdev.test.json --dom --setup=@opentf/afw-test/setup packages/afw-test/tests/render.test.js packages/afw-test/tests/setup.test.js packages/afw-test/tests/types.test.js packages/afw-test/tests/browser/user-event.test.js"

# Website demo behavior, against the site's own installed packages (`tsr site-install`).
[tasks.test-site]
run = "esdev test --dom tests"
dir = "website"

[tasks.test-benchmark-tooling]
run = "esdev test --config=esdev.test.json benchmarks/tests/tooling.test.js"

# Independent processes — cargo and the ES-Runtime — so they overlap.
[tasks.test]
deps = ["test-rust", "test-esdev", "test-esdev-dom", "test-esdev-plugin", "test-afw-docs", "test-afw-docs-dom", "test-afw-form", "test-afw-i18n", "test-afw-test", "test-site", "test-benchmark-tooling"]
parallel = true

# Real-browser tier (docs/HYDRATION.md §5) — framework-behavior suites (docs shell
# drawer/sidebar/hydration) against headless Chrome over CDP, covering
# engine-fidelity paths (custom-element upgrade timing, the real event loop,
# portal relocation) the `--dom` tier can't reach. Slow and browser-dependent,
# so it stays out of `test`. The `afw serve`/`build` CLI e2e retired with the
# CLI; its port-collision notes die with it (each suite spawns its own Chrome —
# keep these sequential until every debugging port comes from the OS).
[tasks.test-e2e-docs-drawer]
deps = ["build-compiler"]
run = "esdev packages/afw-docs/tests/e2e/mobile-drawer.mjs"

[tasks.test-e2e-docs-sidebar]
deps = ["build-compiler"]
run = "esdev packages/afw-docs/tests/e2e/sidebar-collapse.mjs"

[tasks.test-e2e-docs-hydration]
deps = ["build-compiler"]
run = "esdev packages/afw-docs/tests/e2e/hydration.mjs"

[tasks.test-e2e-docs]
deps = ["test-e2e-docs-drawer", "test-e2e-docs-sidebar", "test-e2e-docs-hydration"]

[tasks.test-e2e-afw-test]
deps = ["build-compiler"]
run = "esdev test --config=esdev.test.json --browser --setup=@opentf/afw-test/setup packages/afw-test/tests/browser"

[tasks.test-e2e-benchmark-runner]
run = "esdev test --config=esdev.test.json benchmarks/tests/browser-runner.test.js"

[tasks.test-e2e-hmr]
deps = ["build-compiler"]
run = "esdev scripts/verify-hmr.mjs"

[tasks.test-e2e]
deps = ["test-e2e-docs", "test-e2e-afw-test", "test-e2e-benchmark-runner", "test-e2e-hmr"]

# Local convenience — CI runs the fast and browser tiers as separate parallel jobs, so this
# is the "use my cores" path on a dev machine. `build-compiler` is de-duplicated to one run.
[tasks.ci]
deps = ["typecheck", "test", "test-e2e"]
parallel = true

# --- build --------------------------------------------------------------------

[tasks.build]
run = "esdev build --minify --config=esdev.playground.json"

[tasks.site-build]
run = "esdev build --minify"
dir = "website"

# --- benchmarks ---------------------------------------------------------------

# Runtime benchmark (update latency in a real browser). Args pass through:
#   tsr bench -- all           every case, with a comparison table
#   tsr bench -- afw react    just those two
# See benchmarks/README.md. The SSG build benchmark is a separate, manual procedure —
# benchmarks/ssg-build/README.md.
[tasks.bench]
run = "esdev benchmarks/run.mjs"

[tasks.bench-react-build]
run = "bun build.mjs"
dir = "benchmarks/react"

[tasks.bench-react-dev]
run = "bun build.mjs && bun --cwd dist serve"
dir = "benchmarks/react"

[tasks.bench-solid-build]
run = "bun build.mjs"
dir = "benchmarks/solid"

[tasks.bench-svelte-build]
run = "bun build.mjs"
dir = "benchmarks/svelte"

[tasks.bench-afw-dev]
run = "esdev start --config=esdev.bench.json --port=3010"

[tasks.bench-afw-build]
run = "esdev build --minify --config=esdev.bench.json"
