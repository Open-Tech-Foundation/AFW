<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFW — App Framework for the Web</title>
    <link rel="icon" href="/img/afw-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/afw-logo.svg">

    <script>
      (function () {
        try {
          // "theme" holds the chosen mode: "light" | "dark" | "system" (or unset).
          // Resolve "system"/unset to the OS preference so the first paint is correct.
          var s = localStorage.getItem("theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./app/global.css">
</head>
<body class="bg-white text-slate-900">
    <!-- The AFW toolchain mounts the app here and injects the bundle. -->
    <div id="app"></div>
    <!-- Pure-esdev entry (`esdev start` / `esdev build`); the CLI toolchain
         strips module entries and injects its own bundle instead. -->
    <script type="module" src="./entry.js"></script>
</body>
</html>
