packages:
  - "."

allowBuilds:
  '@opentf/afw-compiler': false

# Released the same day the site moved onto them; pnpm 11 holds back
# versions younger than its minimum release age otherwise.
minimumReleaseAgeExclude:
  - '@opentf/afw@0.32.0 || 0.35.0 || 0.37.0 || 0.39.0'
  - '@opentf/afw-cli@1.30.0 || 1.34.0 || 1.36.0 || 1.38.1'
  - '@opentf/afw-compiler@0.20.0 || 0.23.0 || 0.24.0 || 0.26.0'
  - '@opentf/afw-docs@0.30.0 || 0.33.0 || 0.35.0 || 0.38.0'
  - '@opentf/afw-form@1.27.0 || 1.30.0 || 1.32.0 || 1.34.0'
  - '@opentf/afw-i18n@1.27.0 || 1.30.0 || 1.32.0 || 1.34.0'
  - '@opentf/esdev-plugin-afw@0.4.0 || 0.7.0 || 0.8.0 || 0.11.0'
  - '@opentf/serialize@0.1.0'
  - '@opentf/afw-build@0.2.0 || 0.6.0'
  - '@opentf/syntax-highlighter@0.5.0'
