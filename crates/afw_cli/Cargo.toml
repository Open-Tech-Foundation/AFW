[package]
name = "afw_cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AFW — the IR compiler binary (afwc), invoked by the toolchain. See ARCHITECTURE.md §8."

[[bin]]
name = "afwc"
path = "src/main.rs"

[dependencies]
afw_compiler = { workspace = true }
blake3 = "1"
base64 = "0.22"
scraper = "0.27"
regex = "1"
serde_json = "1"
unicode-normalization = "0.1"
walkdir = "2"
