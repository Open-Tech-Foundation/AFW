[package]
name = "afw_compiler"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AFW — compiler stages: AST -> Semantic Model -> IRs -> codegen. See ARCHITECTURE.md §3."

[dependencies]
# A fork of markdown-rs 1.0.0 carrying one fix (a quadratic in `EditMap::add`
# that made MDX parsing superlinear in page length). Renamed back to `markdown`
# so the call sites are unchanged — see crates/afw_markdown/FORK.md.
markdown = { package = "afw_markdown", path = "../afw_markdown" }
afw_ir = { workspace = true }
oxc = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
