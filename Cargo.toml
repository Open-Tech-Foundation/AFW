# AFW — Rust toolchain workspace.
# See ARCHITECTURE.md for the design this implements.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Open-Tech-Foundation/afw"

[workspace.dependencies]
afw_ir = { path = "crates/afw_ir" }
afw_compiler = { path = "crates/afw_compiler" }

# Parser stack (ARCHITECTURE.md §3). The `oxc` umbrella keeps the sub-crate
# versions aligned; `semantic` seeds Stage 2 (scopes + bindings), `ast_visit`
# provides the Visit traits used by Stage 3 lowering.
oxc = { version = "0.137", features = ["semantic", "ast_visit"] }
